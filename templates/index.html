<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume and Cover Letter Generator</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form { display: grid; grid-template-columns: 1fr 2fr; gap: 1em; }
        label { grid-column: 1; text-align: right; }
        input, textarea, select { grid-column: 2; }
        .full-width { grid-column: 1 / 3; }
        fieldset { border: 1px solid #ccc; padding: 1em; margin-bottom: 1em; }
        legend { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Resume and Cover Letter Generator</h1>
    <form action="/generate" method="post">
        <fieldset class="full-width">
            <legend>Personal Information</legend>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="linkedin">LinkedIn Profile:</label>
            <input type="url" id="linkedin" name="linkedin">

            <label for="github">GitHub Profile:</label>
            <input type="url" id="github" name="github">
        </fieldset>

        <fieldset class="full-width">
            <legend>Career Objective</legend>
            <label for="career_summary">Career Summary:</label>
            <textarea id="career_summary" name="career_summary" rows="4" required></textarea>

            <label for="job_target">Target Job Title:</label>
            <input type="text" id="job_target" name="job_target" required>
        </fieldset>

        <fieldset class="full-width">
            <legend>Company Information (for Cover Letter)</legend>
            <label for="date">Date:</label>
            <input type="text" id="date" name="date" value="October 10, 2025" required>

            <label for="hiring_manager_name">Hiring Manager's Name:</label>
            <input type="text" id="hiring_manager_name" name="hiring_manager_name" required>

            <label for="company_name">Company Name:</label>
            <input type="text" id="company_name" name="company_name" required>

            <label for="company_address">Company Address:</label>
            <input type="text" id="company_address" name="company_address" required>
        </fieldset>

        <fieldset class="full-width">
            <legend>Work Experience</legend>
            <!-- JavaScript will add fields for work experience here -->
            <div id="work_experience_fields"></div>
            <button type="button" onclick="addWorkExperience()">Add Work Experience</button>
        </fieldset>

        <fieldset class="full-width">
            <legend>Education</legend>
            <!-- JavaScript will add fields for education here -->
            <div id="education_fields"></div>
            <button type="button" onclick="addEducation()">Add Education</button>
        </fieldset>

        <fieldset class="full-width">
            <legend>Skills</legend>
            <label for="skills">Skills (comma-separated):</label>
            <input type="text" id="skills" name="skills" required>
        </fieldset>

        <fieldset class="full-width">
            <legend>Document Selection</legend>
            <label for="document_type">Document to Generate:</label>
            <select id="document_type" name="document_type">
                <option value="ats_resume">ATS-Friendly Resume</option>
                <option value="ats_cover_letter">ATS-Friendly Cover Letter</option>
                <option value="modern_canadian_resume">Modern Canadian Resume</option>
                <option value="modern_canadian_cover_letter">Modern Canadian Cover Letter</option>
            </select>
        </fieldset>

        <div class="full-width" style="text-align: center;">
            <button type="submit">Generate Document</button>
        </div>
    </form>

    <script>
        function addWorkExperience() {
            const container = document.getElementById('work_experience_fields');
            const index = container.children.length;
            const fields = `
                <h4>Work Experience #${index + 1}</h4>
                <label>Job Title:</label> <input type="text" name="work_experience-${index}-title" required>
                <label>Company:</label> <input type="text" name="work_experience-${index}-company" required>
                <label>Start Date:</label> <input type="text" name="work_experience-${index}-start_date" required>
                <label>End Date:</label> <input type="text" name="work_experience-${index}-end_date" required>
                <label>Description:</label> <textarea name="work_experience-${index}-description" rows="3" required></textarea>
            `;
            const div = document.createElement('div');
            div.innerHTML = fields;
            container.appendChild(div);
        }

        function addEducation() {
            const container = document.getElementById('education_fields');
            const index = container.children.length;
            const fields = `
                <h4>Education #${index + 1}</h4>
                <label>Degree:</label> <input type="text" name="education-${index}-degree" required>
                <label>Institution:</label> <input type="text" name="education-${index}-institution" required>
                <label>Start Date:</label> <input type="text" name="education-${index}-start_date" required>
                <label>End Date:</label> <input type="text" name="education-${index}-end_date" required>
            `;
            const div = document.createElement('div');
            div.innerHTML = fields;
            container.appendChild(div);
        }

        // Add one of each by default
        addWorkExperience();
        addEducation();
    </script>
</body>
</html>
