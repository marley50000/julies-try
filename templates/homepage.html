<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Your Template</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}">
</head>
<body>
    <header class="hero">
        <h1>Choose Your Professional Look</h1>
        <p>Select a template below to get started with your resume or cover letter.</p>
    </header>

    <main class="template-gallery">
        <a href="{{ url_for('show_form', template_name='elegant_professional_resume') }}" class="template-card">
            <img src="https://via.placeholder.com/400x565.png/345d7e/ffffff?text=Elegant+Professional" alt="Elegant Professional Resume Preview">
            <div class="template-name">Elegant Professional Resume (New)</div>
        </a>

        <a href="{{ url_for('show_form', template_name='modern_professional_resume') }}" class="template-card">
            <img src="https://via.placeholder.com/400x565.png/4a90e2/ffffff?text=Modern+Professional" alt="Modern Professional Resume Preview">
            <div class="template-name">Modern Professional Resume</div>
        </a>

        <a href="{{ url_for('show_form', template_name='modern_canadian_resume') }}" class="template-card">
            <img src="https://via.placeholder.com/400x565.png/2c3e50/ffffff?text=Modern+Canadian" alt="Modern Canadian Resume Preview">
            <div class="template-name">Modern Canadian Resume</div>
        </a>

        <a href="{{ url_for('show_form', template_name='ats_resume') }}" class="template-card">
            <img src="https://via.placeholder.com/400x565.png/95a5a6/ffffff?text=ATS+Friendly" alt="ATS-Friendly Resume Preview">
            <div class="template-name">ATS-Friendly Resume</div>
        </a>
    </main>
</body>
</html>
